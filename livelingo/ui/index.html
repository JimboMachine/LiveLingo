<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveLingo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" data-view="main">

  <!-- 主畫面 -->
  <section id="view-main" class="view">
    <header class="topbar">
      <svg class="logo" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24"><path d="M3 5h11a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H8l-4 3v-3H3z"/><path d="M19 10h2v9l-3-2h-6a2 2 0 0 1-2-2"/></svg>
      <div class="brand">LiveLingo</div>
      <div class="status" id="status"><span class="dot"></span><span id="status-text"></span></div>
      <div class="grow"></div>
      <button class="icon-btn" data-act="overlay-toggle" data-i18n-label="overlay_toggle" id="btn-overlay" aria-pressed="false">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M4 7h3M10 7h10M4 12h3M10 12h7M4 17h3M10 17h9"/></svg>
      </button>
      <button class="icon-btn" data-act="view" data-view="subtitle" data-i18n-label="subtitle_mode" id="btn-subtitle">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h6M15 15h2"/></svg>
      </button>
      <button class="icon-btn" data-act="view" data-view="settings" data-i18n-label="settings">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>

    <div class="sources">
      <div class="sources-head">
        <div class="dim small" data-i18n="sources_label"></div>
        <button class="chip" id="lang-chip" data-act="toggle-langs" aria-expanded="false" data-i18n-label="pick_langs">
          <svg aria-hidden="true" class="accent" width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
          <span id="pair-label"></span>
          <svg aria-hidden="true" class="dim-stroke" width="14" height="14" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
      <div class="lang-picker" id="lang-picker" hidden></div>
      <div class="cards" id="source-cards"></div>
      <div class="region-row dim small" id="region-row" hidden></div>
    </div>

    <div class="messages" id="messages" aria-live="polite"></div>

    <form class="saybar" id="say-form">
      <label for="say" class="dim small" id="say-label"></label>
      <div class="row">
        <input id="say" autocomplete="off" maxlength="500">
        <button class="primary" type="submit" data-i18n="translate"></button>
      </div>
    </form>
  </section>

  <!-- 字幕列 -->
  <section id="view-subtitle" class="view">
    <div class="subbar">
      <span class="badge" id="sub-badge"></span>
      <div class="sub-text">
        <div class="sub-main" id="sub-main"></div>
        <div class="sub-orig dim" id="sub-orig"></div>
      </div>
      <button class="icon-btn bordered" id="sub-mic" data-act="source" data-key="mic" data-i18n-label="toggle_mic">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="icon-btn" data-act="view" data-view="main" data-i18n-label="back_full">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>
      </button>
    </div>
  </section>

  <!-- 設定 -->
  <section id="view-settings" class="view">
    <nav class="side" id="settings-nav"></nav>
    <main class="page" id="settings-page"></main>
  </section>

  <!-- 第一次設定 -->
  <section id="view-wizard" class="view">
    <div class="wizard" id="wizard"></div>
    <div class="dlstrip" id="wizard-dl" hidden></div>
  </section>

  <!-- 蓋在最上面的畫面：更新、下載、錯誤 -->
  <div class="overlay" id="overlay" hidden></div>
  <div class="ov-banner" id="ov-banner" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
