<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveLingo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" data-view="main">

  <!-- 固定在左邊的導覽 -->
  <nav class="rail" id="rail" aria-label="LiveLingo"></nav>

  <!-- 主畫面 -->
  <section id="view-main" class="view">
    <header class="topbar">
      <h1 class="view-title" data-i18n="nav_chat"></h1>
      <div class="status" id="status"><span class="dot"></span><span id="status-text"></span></div>
      <button class="quality-chip" id="quality-chip" data-act="nav" data-to="quality" hidden></button>
      <div class="grow"></div>
      <button class="icon-btn" id="btn-private" data-act="private" aria-pressed="false">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </button>
      <button class="rec-btn" id="btn-record" data-act="record" aria-pressed="false"></button>
      <button class="icon-btn" data-act="overlay-toggle" data-i18n-label="overlay_toggle" id="btn-overlay" aria-pressed="false">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M4 7h3M10 7h10M4 12h3M10 12h7M4 17h3M10 17h9"/></svg>
      </button>
    </header>

    <div class="up-banner" id="up-banner" role="status" hidden></div>

    <div class="sources">
      <div class="sources-head">
        <div class="dim small" data-i18n="sources_label"></div>
        <button class="chip" id="lang-chip" data-act="toggle-langs" aria-expanded="false" data-i18n-label="pick_langs">
          <svg aria-hidden="true" class="accent" width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
          <span id="pair-label"></span>
          <svg aria-hidden="true" class="dim-stroke" width="14" height="14" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
      <div class="lang-picker" id="lang-picker" hidden></div>
      <div class="scen-row" id="scen-row" hidden></div>
      <div class="cards" id="source-cards"></div>
      <div class="mic-row" id="priv-row" hidden></div>
      <div class="mic-row" id="name-row" hidden></div>
      <div class="mic-row" id="mic-row" hidden></div>
      <div class="mic-row" id="rec-row" hidden></div>
      <div class="region-row dim small" id="region-row" hidden></div>
    </div>

    <div class="messages" id="messages" aria-live="polite"></div>

    <form class="saybar" id="say-form">
      <label for="say" class="dim small" id="say-label"></label>
      <div class="row">
        <input id="say" autocomplete="off" maxlength="2000">
        <button class="primary" type="submit" data-i18n="translate"></button>
      </div>
    </form>
  </section>

  <!-- 設定 -->
  <section id="view-settings" class="view">
    <!-- 每一頁設定最上面的搜尋框：打幾個字，列出哪一頁的哪一區有，按下去就跳過去 -->
    <div class="settings-bar" id="settings-bar" role="search">
      <div class="sq-field">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input type="search" id="settings-q" autocomplete="off" spellcheck="false" maxlength="60" data-i18n-label="sq_label" data-i18n-ph="sq_ph">
        <button class="icon-btn sq-clear" data-act="sq-clear" data-i18n-label="sq_clear" hidden>
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
    <div class="settings-body">
      <main class="page" id="settings-page"></main>
      <div class="sq-results" id="sq-results" hidden></div>
    </div>
  </section>

  <!-- 第一次設定 -->
  <section id="view-wizard" class="view">
    <div class="wizard" id="wizard"></div>
    <div class="dlstrip" id="wizard-dl" hidden></div>
  </section>

  <!-- 蓋在最上面的畫面：更新、下載、錯誤 -->
  <div class="overlay" id="overlay" hidden></div>
  <div class="ov-banner" id="ov-banner" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="saved-chip" id="saved-chip" role="status" hidden></div>

  <!-- 啟動畫面：介面讀到狀態之前先看到品牌，不是一片黑 -->
  <div class="splash" id="splash">
    <span data-mark></span>
    <div class="wordmark" data-wordmark></div>
    <div class="bar"><i></i></div>
  </div>
</div>
<script src="brand.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
